<div class="contratar-container">
  <div class="contratar-wrapper">
    <!-- Sticky Header -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-5 py-3 flex justify-between items-center">
      <button class="h-9 w-9 rounded-full border border-slate-200 flex items-center justify-center text-slate-400 hover:text-primary-blue hover:border-primary-blue-light transition-colors cursor-pointer bg-slate-50" (click)="onVolver()">
        <i data-lucide="arrow-left" class="w-5 h-5 stroke-[1.5]"></i>
      </button>
      <div class="flex items-center gap-5 text-primary-blue-medium">
        <button class="hover:text-primary-blue transition-colors"><i data-lucide="eye" class="w-6 h-6 stroke-[1.5]"></i></button>
        <button class="hover:text-primary-blue transition-colors"><i data-lucide="mail" class="w-6 h-6 stroke-[1.5]"></i></button>
        <button class="hover:text-primary-blue transition-colors"><i data-lucide="message-circle-question" class="w-6 h-6 stroke-[1.5]"></i></button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col gap-8 pt-2">
      <!-- Hero Section -->
      <section class="px-5">
        <h1 class="text-lg font-bold text-slate-900 mb-5 tracking-tight">Laura, esto te puede interesar</h1>

        <!-- Promo genérica cashback -->
        <div
          class="cashback-promo-card"
          (click)="onCashbackPromoClick()">
          <div class="cashback-card-header">
            <div class="cashback-badge">
              <i data-lucide="wallet" class="w-4 h-4"></i>
              <span>Cashback</span>
            </div>
            <div class="prestamo-logo">
              <div class="prestamo-logo-circle cashback-logo-circle">BS</div>
            </div>
          </div>
          <div class="cashback-card-body">
            <h3 class="cashback-title">Recupera dinero con tus compras</h3>
            <p class="cashback-subtitle">
              Acumula saldo en tu cuenta cuando pagues con tu tarjeta. Sin complicaciones.
            </p>
          </div>
          <div class="cashback-card-actions">
            <button
              type="button"
              class="cashback-cta"
              (click)="onCashbackPromoClick(); $event.stopPropagation()">
              Ver cómo funciona
            </button>
          </div>
        </div>
      </section>

      <!-- Product List -->
      <section>
        <h2 class="px-5 text-lg font-bold text-slate-900 mb-4 tracking-tight">Nuestros productos</h2>
        
        <div class="flex flex-col divide-y divide-slate-100 border-t border-slate-100">
          <!-- Préstamos y créditos -->
          <button class="flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition-colors group" (click)="onIrAPrestamos()">
            <div class="flex items-center gap-4">
              <i data-lucide="hand-coins" class="w-6 h-6 text-slate-900 stroke-[1.5]"></i>
              <span class="text-sm font-medium text-slate-900">Préstamos y créditos</span>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-primary-blue-medium stroke-[1.5] group-hover:translate-x-0.5 transition-transform"></i>
          </button>

          <!-- Tarjetas -->
          <button class="flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition-colors group">
            <div class="flex items-center gap-4">
              <i data-lucide="credit-card" class="w-6 h-6 text-slate-900 stroke-[1.5]"></i>
              <span class="text-sm font-medium text-slate-900">Tarjetas</span>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-primary-blue-medium stroke-[1.5] group-hover:translate-x-0.5 transition-transform"></i>
          </button>

          <!-- Cuentas -->
          <button class="flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition-colors group">
            <div class="flex items-center gap-4">
              <i data-lucide="files" class="w-6 h-6 text-slate-900 stroke-[1.5]"></i>
              <span class="text-sm font-medium text-slate-900">Cuentas</span>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-primary-blue-medium stroke-[1.5] group-hover:translate-x-0.5 transition-transform"></i>
          </button>

          <!-- Hipotecas -->
          <button class="flex items-center justify-between px-5 py-4 hover:bg-slate-50 transition-colors group">
            <div class="flex items-center gap-4">
              <i data-lucide="house" class="w-6 h-6 text-slate-900 stroke-[1.5]"></i>
              <span class="text-sm font-medium text-slate-900">Hipotecas</span>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5 text-primary-blue-medium stroke-[1.5] group-hover:translate-x-0.5 transition-transform"></i>
          </button>
        </div>
      </section>
    </main>

    <!-- Sticky Bottom Navigation -->
    <nav class="navbar-bottom navbar-sticky">
      <div class="navbar-content">
        <button type="button" class="navbar-item" (click)="onVolver()">
          <i data-lucide="home" class="navbar-icon"></i>
          <span class="navbar-label">Inicio</span>
        </button>

        <button 
          type="button"
          class="navbar-center-button"
          aria-label="Menú principal"
        >
          <i data-lucide="layout-grid" class="navbar-center-icon"></i>
        </button>

        <button type="button" class="navbar-item navbar-item-active">
          <div class="navbar-indicator"></div>
          <i data-lucide="plus-circle" class="navbar-icon"></i>
          <span class="navbar-label">Contratar</span>
        </button>
      </div>
      <div class="navbar-spacer"></div>
    </nav>
  </div>
</div>
